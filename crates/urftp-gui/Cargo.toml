[package]
name = "urftp-gui"
description = "Interface graphique Windows d'UltraRushFTP (onglets, panneaux, file d'attente)."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "UltraRushFTP"
path = "src/main.rs"

[dependencies]
parking_lot.workspace = true
thiserror.workspace = true
urftp-core.workspace = true
urftp-proto.workspace = true
urftp-script.workspace = true
urftp-sys.workspace = true
urftp-i18n.workspace = true
eframe = "0.36"
egui_dock = "0.21.1"
egui_extras = "0.36"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "fs", "time"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
