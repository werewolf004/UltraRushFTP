[package]
name = "urftp-gui"
description = "Windows graphical interface of UltraRushFTP (tabs, file panels, queue)."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "UltraRushFTP"
path = "src/main.rs"

[dependencies]
parking_lot.workspace = true
thiserror.workspace = true
urftp-core.workspace = true
urftp-proto.workspace = true
urftp-script.workspace = true
urftp-sys.workspace = true
urftp-i18n.workspace = true
eframe = "0.37"
egui_dock = { version = "0.22.0", features = ["serde"] }
egui_extras = "0.37"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "fs", "time"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
crc32fast = "1.5.0"
# `wgpu`: off-screen rendering of the documentation screenshots (tests only).
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3.0.12"
