[package]
name = "urftp-core"
description = "Data model of UltraRushFTP: sites, bookmarks, tabs, queue, skip list."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
regex = "1.13.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SFV (CRC32) and MD5 checks of the transferred files.
crc32fast = "1.5.0"
md-5 = "0.10.6"
