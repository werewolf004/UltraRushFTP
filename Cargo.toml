[workspace]
resolver = "3"
members = [
    "crates/urftp-core",
    "crates/urftp-proto",
    "crates/urftp-script",
    "crates/urftp-i18n",
    "crates/urftp-sys",
    "crates/rushmirc",
    "crates/urftp-cli",
    "crates/urftp-gui",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license-file = "LICENSE"
authors = ["werewolf004"]
repository = "https://github.com/werewolf004/UltraRushFTP"
publish = false
rust-version = "1.99"

[workspace.dependencies]
urftp-core = { path = "crates/urftp-core" }
urftp-proto = { path = "crates/urftp-proto" }
urftp-script = { path = "crates/urftp-script" }
urftp-sys = { path = "crates/urftp-sys" }
urftp-i18n = { path = "crates/urftp-i18n" }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros", "fs"] }
thiserror = "2"
parking_lot = "0.12"

# Quality gates shared by every crate except `urftp-sys` (the only one allowed `unsafe`,
# with its own stricter rules in its manifest).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
